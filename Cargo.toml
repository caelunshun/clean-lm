[workspace]
members = [
    "cleandl", 
    "kernel-generator",
    "sky-1",
    "skytokens",
]
exclude = ["cleandl/rust-kernels"]
resolver = "3"

[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = "limited"

[profile.max-perf]
inherits = "release"
codegen-units = 1
lto = "thin"

[patch.'https://github.com/caelunshun/skycuda']
skycuda = { path = "../skycuda" }
skycuda-cudnn = { path = "../skycuda/skycuda-cudnn" }
skycuda-cublaslt = { path = "../skycuda/skycuda-cublaslt" }
