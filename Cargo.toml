[workspace]
members = [
    "cleandl",
    "sky-1",
    "cleandl/rust-kernels",
    "cleandl/rust-kernels/cuda-device-ext",
    "skytokens",
]
resolver = "3"

[profile.dev.package.'*']
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
debug = "limited"

[profile.max-perf]
inherits = "release"
codegen-units = 1
lto = "thin"
