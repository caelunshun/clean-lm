[package]
name = "cleandl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rand = "0.10"
rand_distr = "0.6"
rand_xoshiro = "0.8"
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1.25", features = ["derive"] }
skycuda = { git = "https://github.com/caelunshun/skycuda" }
skycuda-cudnn = { git = "https://github.com/caelunshun/skycuda" }
skycuda-cublaslt = { git = "https://github.com/caelunshun/skycuda" }
skytens-core = { git = "https://github.com/caelunshun/skykern" }
rayon = "1"
thread_local = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
parking_lot = "0.12"
wide = "1.7"
bytesize = "2.7"
directories = "6.0"
serde_json = "1"
typetag = "0.2"
tracing = "0.1"
bumpalo = "3.20"

[dev-dependencies]
float-cmp = "0.10"
faer = "0.24"
