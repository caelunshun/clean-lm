[target.nvptx64-nvidia-cuda]
rustflags = [
    "-C",
    "target-feature=+ptx93",
    "-C",
    "target-cpu=sm_100a",
    "-Z",
    "unstable-options",
    "-C",
    "panic=immediate-abort",
    "-Z",
    "next-solver",
]
rustdocflags = ["-C", "target-feature=+ptx93", "-C", "target-cpu=sm_100a"]

[build]
target = "nvptx64-nvidia-cuda"

[unstable]
build-std = ["core", "compiler_builtins"]
