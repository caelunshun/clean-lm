[package]
name = "kernel-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
nvvm-builder = { path = "../../../nvvm-rs/crates/nvvm-builder" }
tileir-builder = { path = "../../../tileir-rs/crates/tileir-builder" }
thiserror = "2.0.21"
skytens-core = { git = "https://github.com/caelunshun/skykern" }
serde = { version = "1.0.229", features = ["derive"] }
skycuda = { git = "https://github.com/caelunshun/skycuda" }
derive-where = "1.7.0"
clap = { version = "4.6.7", features = ["derive"], optional = true }
tracing = "0.1.44"
# z3 = { version = "0.21.1", features = ["gh-release"] }

[features]
clap = ["dep:clap"]
