[package]
name = "skytokens"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bstr = "1.13.1"
compact_bytes = "0.2.1"
hashbrown = "0.17.1"
lz4_flex = { version = "0.14.0", default-features = false, features = [
    "std",
    "frame",
    "checked-decode",
    "nightly",
] }
memchr = "2.8.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
