[package]
name = "sky-1"
version = "0.1.0"
edition = "2024"

[dependencies]
cleandl = { path = "../cleandl" }
skycuda = { git = "https://github.com/caelunshun/skycuda" }
skytens-core = { git = "https://github.com/caelunshun/skykern" }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
rand = "0.10"
rand_distr = "0.6"
bytemuck = "1.25"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
parquet = { version = "60.0.0", features = ["async", "object_store"] }
object_store = { version = "0.14.2", features = ["aws"] }
tokio = { version = "1.53.1", features = ["full"] }
rayon = "1.12.0"
compact_str = "0.10.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
json5 = "1.3.1"
jiff = { version = "0.2.37", features = ["serde"] }
zstd = "0.14.0"
reddit-ingest = { git = "https://github.com/caelunshun/reddit-ingest", branch = "main" }
postcard = { version = "1.1.3", features = ["use-std"] }
fs-err = "3.3.1"
serde_json = "1.0.151"
skytokens = { path = "../skytokens" }
strum = { version = "0.28.0", features = ["derive"] }
aho-corasick = "1.1.5"
mimalloc = "0.1.52"
memchr = "2.8.3"
safetensors = "0.8.0"
flume = "0.12.0"
csv = "1.4.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
blosc2 = { version = "0.2.3", default-features = false, features = ["zstd"] }

[dev-dependencies]
tempfile = "3.27.0"
